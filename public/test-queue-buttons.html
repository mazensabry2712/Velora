<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أزرار الطابور - تصحيح</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">🔧 اختبار أزرار الطابور</h1>
            <p class="text-gray-600 mb-4">افتح هذه الصفحة في تاب جديد بجانب صفحة المواعيد</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">1️⃣ اختبار سريع</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">رقم الموعد:</label>
                    <input type="number" id="appointmentId" class="border border-gray-300 rounded-lg px-4 py-2 w-full" placeholder="مثال: 1" value="1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="testAdd()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                        اختبار إضافة
                    </button>
                    <button onclick="testRemove()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        اختبار إزالة
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">📊 النتائج</h2>
            <div id="results" class="space-y-2 font-mono text-sm">
                <div class="text-gray-500">اضغط على أحد الأزرار أعلاه...</div>
            </div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6">
            <h3 class="font-bold text-blue-900 mb-2">💡 ملاحظات:</h3>
            <ul class="text-sm text-blue-800 space-y-1">
                <li>• يجب أن تكون مسجل دخول كأدمن</li>
                <li>• تأكد من وجود موعد بالرقم المحدد</li>
                <li>• افتح Console (F12) لرؤية التفاصيل</li>
            </ul>
        </div>
    </div>

    <script>
        const baseUrl = window.location.origin;
        let csrfToken = null;

        // محاولة الحصول على CSRF token من الصفحة الرئيسية
        async function getCsrfToken() {
            try {
                const response = await fetch(`${baseUrl}/admin/appointments`);
                const html = await response.text();
                const match = html.match(/<meta name="csrf-token" content="([^"]+)"/);
                if (match) {
                    csrfToken = match[1];
                    log('✅ تم الحصول على CSRF Token', 'success');
                    return true;
                }
            } catch (error) {
                log('❌ فشل الحصول على CSRF Token: ' + error.message, 'error');
            }
            return false;
        }

        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const colors = {
                success: 'text-green-600',
                error: 'text-red-600',
                info: 'text-blue-600',
                warning: 'text-yellow-600'
            };

            const time = new Date().toLocaleTimeString('ar-EG');
            const div = document.createElement('div');
            div.className = `p-2 rounded ${colors[type] || 'text-gray-600'}`;
            div.textContent = `[${time}] ${message}`;
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;

            console.log(message);
        }

        async function testAdd() {
            const id = document.getElementById('appointmentId').value;
            if (!id) {
                log('❌ يرجى إدخال رقم الموعد', 'error');
                return;
            }

            log(`🔄 بدء اختبار إضافة الموعد #${id}...`, 'info');

            // الحصول على CSRF Token
            if (!csrfToken) {
                const success = await getCsrfToken();
                if (!success) {
                    log('❌ لم يتم الحصول على CSRF Token. تأكد من تسجيل الدخول.', 'error');
                    return;
                }
            }

            // اختبار الـ API
            try {
                log(`📡 إرسال طلب إلى: /admin/api/appointments/${id}/add-to-queue`, 'info');

                const response = await fetch(`${baseUrl}/admin/api/appointments/${id}/add-to-queue`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    }
                });

                log(`📥 Response Status: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'warning');

                const result = await response.json();
                log(`📄 Response Body: ${JSON.stringify(result, null, 2)}`, 'info');

                if (response.ok && result.success) {
                    log('✅ نجح! تمت إضافة الموعد للطابور', 'success');
                } else {
                    log(`❌ فشل: ${result.message || 'خطأ غير معروف'}`, 'error');
                }
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        async function testRemove() {
            const id = document.getElementById('appointmentId').value;
            if (!id) {
                log('❌ يرجى إدخال رقم الموعد', 'error');
                return;
            }

            log(`🔄 بدء اختبار إزالة الموعد #${id}...`, 'info');

            // الحصول على CSRF Token
            if (!csrfToken) {
                const success = await getCsrfToken();
                if (!success) {
                    log('❌ لم يتم الحصول على CSRF Token. تأكد من تسجيل الدخول.', 'error');
                    return;
                }
            }

            // اختبار الـ API
            try {
                log(`📡 إرسال طلب إلى: /admin/api/appointments/${id}/remove-from-queue`, 'info');

                const response = await fetch(`${baseUrl}/admin/api/appointments/${id}/remove-from-queue`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    }
                });

                log(`📥 Response Status: ${response.status} ${response.statusText}`,
                    response.ok ? 'success' : 'warning');

                const result = await response.json();
                log(`📄 Response Body: ${JSON.stringify(result, null, 2)}`, 'info');

                if (response.ok && result.success) {
                    log('✅ نجح! تمت إزالة الموعد من الطابور', 'success');
                } else {
                    log(`❌ فشل: ${result.message || 'خطأ غير معروف'}`, 'error');
                }
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        // تحميل CSRF Token عند فتح الصفحة
        window.addEventListener('load', () => {
            log('🚀 جاهز للاختبار', 'success');
            getCsrfToken();
        });
    </script>
</body>
</html>
