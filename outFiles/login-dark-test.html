<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة Dark Mode - Login Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-100 dark:from-slate-900 dark:to-slate-800 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Language & Dark Mode Switcher -->
    <div class="absolute top-4 left-4 flex items-center gap-3">
        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()"
            class="p-3 rounded-lg bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-lg"
            title="تبديل الوضع الليلي">
            <span id="dark-mode-icon" class="text-2xl">🌙</span>
        </button>

        <!-- Language Switcher -->
        <div class="inline-flex rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-1 shadow-lg">
            <button class="px-3 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white">
                عربي
            </button>
            <button class="px-3 py-2 text-sm font-medium rounded-md text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100">
                EN
            </button>
        </div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-200 dark:border-slate-700 transition-colors duration-300">
            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">
                    تسجيل الدخول
                </h1>
                <p class="text-indigo-600 dark:text-indigo-400 font-semibold">Demo Clinic</p>
            </div>

            <!-- Form -->
            <form class="space-y-5">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 text-right">
                        البريد الإلكتروني
                    </label>
                    <input type="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent transition-all"
                        dir="rtl">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 text-right">
                        كلمة المرور
                    </label>
                    <input type="password"
                        placeholder="أدخل كلمة المرور"
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent transition-all"
                        dir="rtl">
                </div>

                <!-- Remember & Forgot -->
                <div class="flex items-center justify-between text-sm">
                    <a href="#" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-medium">
                        نسيت كلمة المرور؟
                    </a>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <span class="text-slate-600 dark:text-slate-300">تذكرني</span>
                        <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded border-slate-300 dark:border-slate-600 focus:ring-indigo-500">
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="button"
                    class="w-full py-3 px-4 bg-indigo-600 dark:bg-indigo-500 text-white font-semibold rounded-lg hover:bg-indigo-700 dark:hover:bg-indigo-600 transition-all shadow-lg hover:shadow-xl transform hover:scale-[1.02] text-lg">
                    دخول
                </button>
            </form>
        </div>

        <!-- Status Display -->
        <div class="mt-6 bg-white dark:bg-slate-800 rounded-xl shadow-lg p-4 border border-slate-200 dark:border-slate-700">
            <div class="flex items-center justify-between text-sm">
                <span class="font-bold text-slate-700 dark:text-slate-300">الوضع الحالي:</span>
                <span id="current-status" class="font-bold text-indigo-600 dark:text-indigo-400">...</span>
            </div>
        </div>
    </div>

    <!-- Dark Mode Script -->
    <script>
        // تحميل الإعداد المحفوظ
        function loadDarkMode() {
            const darkMode = localStorage.getItem('darkMode');
            if (darkMode === 'true' || (!darkMode && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateStatus();
        }

        // تبديل وضع الدارك مود
        function toggleDarkMode() {
            console.log('🔄 Toggle clicked!');
            const isDark = document.documentElement.classList.toggle('dark');
            console.log('🌓 New state:', isDark ? 'DARK' : 'LIGHT');
            localStorage.setItem('darkMode', isDark);
            updateStatus();
        }

        // تحديث عرض الحالة
        function updateStatus() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('dark-mode-icon');
            const status = document.getElementById('current-status');

            if (icon) {
                icon.textContent = isDark ? '☀️' : '🌙';
            }
            if (status) {
                status.textContent = isDark ? '🌙 وضع ليلي' : '☀️ وضع نهاري';
            }

            console.log('📊 Status updated:', isDark ? 'DARK' : 'LIGHT');
        }

        // تهيئة
        loadDarkMode();
        console.log('✅ Login test page loaded!');
    </script>
</body>
</html>
