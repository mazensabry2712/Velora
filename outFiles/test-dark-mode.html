<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .log { font-family: monospace; padding: 8px; margin: 4px 0; border-radius: 4px; }
        .log.info { background: #dbeafe; }
        .log.success { background: #dcfce7; }
        .log.warning { background: #fef3c7; }
        .log.error { background: #fee2e2; }
    </style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white p-8 transition-colors">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🔍 اختبار Dark Mode - Debug Panel</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-indigo-50 dark:bg-indigo-900 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">⚙️ التحكم</h2>
                <button onclick="toggleTest()"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg mb-2">
                    تبديل Dark Mode
                </button>
                <button onclick="clearAll()"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg">
                    مسح كل الإعدادات
                </button>
            </div>

            <div class="bg-green-50 dark:bg-green-900 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">📊 الحالة الحالية</h2>
                <div id="status" class="space-y-2"></div>
            </div>
        </div>

        <div class="bg-slate-100 dark:bg-slate-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">📝 Console Logs</h2>
            <div id="logs" class="space-y-1 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const log = document.createElement('div');
            log.className = 'log ' + type;
            log.textContent = new Date().toLocaleTimeString('ar-EG') + ' - ' + message;
            logsDiv.insertBefore(log, logsDiv.firstChild);
            console.log(message);
        }

        function updateStatus() {
            const isDark = document.documentElement.classList.contains('dark');
            const adminDark = localStorage.getItem('adminDarkMode');
            const bookingDark = localStorage.getItem('bookingDarkMode');
            const queueDark = localStorage.getItem('queueDarkMode');
            const oldDark = localStorage.getItem('darkMode');

            document.getElementById('status').innerHTML = `
                <div class="font-bold ${isDark ? 'text-yellow-600' : 'text-blue-600'}">
                    🌓 الوضع الحالي: ${isDark ? 'Dark 🌙' : 'Light ☀️'}
                </div>
                <div class="text-sm space-y-1 mt-2">
                    <div>adminDarkMode: <strong>${adminDark || 'null'}</strong></div>
                    <div>bookingDarkMode: <strong>${bookingDark || 'null'}</strong></div>
                    <div>queueDarkMode: <strong>${queueDark || 'null'}</strong></div>
                    <div>darkMode (old): <strong>${oldDark || 'null'}</strong></div>
                </div>
            `;
        }

        function toggleTest() {
            const wasDark = document.documentElement.classList.contains('dark');
            const nowDark = document.documentElement.classList.toggle('dark');
            const value = String(nowDark);

            localStorage.setItem('adminDarkMode', value);

            addLog(`🔄 Toggle: ${wasDark ? 'Dark' : 'Light'} → ${nowDark ? 'Dark' : 'Light'}`, 'info');
            addLog(`💾 Saved to localStorage: "${value}"`, 'success');

            updateStatus();
        }

        function clearAll() {
            localStorage.removeItem('adminDarkMode');
            localStorage.removeItem('bookingDarkMode');
            localStorage.removeItem('queueDarkMode');
            localStorage.removeItem('darkMode');

            addLog('🗑️ مسح كل إعدادات Dark Mode', 'warning');
            updateStatus();
        }

        // Initialize
        addLog('🚀 تحميل الصفحة...', 'info');
        updateStatus();

        // Check what would happen on page load
        const savedMode = localStorage.getItem('adminDarkMode');
        addLog(`📖 localStorage.getItem('adminDarkMode'): "${savedMode}"`, 'info');

        if (savedMode === 'true') {
            addLog('✅ Would enable dark mode (savedMode === "true")', 'success');
        } else if (savedMode === 'false') {
            addLog('☀️ Would enable light mode (savedMode === "false")', 'success');
        } else if (savedMode === null) {
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            addLog(`🖥️ Would use system preference: ${systemPrefersDark ? 'Dark' : 'Light'}`, 'info');
        }
    </script>
</body>
</html>
