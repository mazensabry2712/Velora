name: Velora Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: velora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, bcmath, curl, xml, zip, gd, intl, pdo, pdo_mysql
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        env:
          APP_ENV: testing
          APP_DEBUG: true
          CACHE_STORE: file
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: velora_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          TENANCY_CENTRAL_CONNECTION: mysql
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan optimize:clear
          php artisan migrate --force

      - name: Run test suite
        env:
          APP_URL: http://velora.test
          APP_DOMAIN: velora.test
          APP_BASE_DOMAIN: velora.test
          CACHE_STORE: file
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: velora_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          TENANCY_CENTRAL_CONNECTION: mysql
        run: php artisan test --compact
