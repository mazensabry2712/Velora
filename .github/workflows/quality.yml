name: Velora Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP Tests & Static Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: velora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations sanity check
        env:
          APP_URL: http://bookora.test
          APP_DOMAIN: bookora.test
          APP_BASE_DOMAIN: bookora.test
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          TENANCY_CENTRAL_CONNECTION: sqlite
        run: php artisan migrate --force

      - name: Run full PHPUnit suite
        env:
          APP_URL: http://bookora.test
          APP_DOMAIN: bookora.test
          APP_BASE_DOMAIN: bookora.test
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          TENANCY_CENTRAL_CONNECTION: sqlite
        run: php artisan test --compact

      - name: Check code style
        run: vendor/bin/pint --test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
