name: Velora Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP Tests & Static Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: velora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Prepare environment
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_URL: http://velora.test
          APP_DOMAIN: velora.test
          APP_BASE_DOMAIN: velora.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: velora_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          TENANCY_CENTRAL_CONNECTION: mysql
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations sanity check
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_URL: http://velora.test
          APP_DOMAIN: velora.test
          APP_BASE_DOMAIN: velora.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: velora_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          TENANCY_CENTRAL_CONNECTION: mysql
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan migrate --force

      - name: Run full PHPUnit suite
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_URL: http://velora.test
          APP_DOMAIN: velora.test
          APP_BASE_DOMAIN: velora.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: velora_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          TENANCY_CENTRAL_CONNECTION: mysql
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --compact

      - name: Check code style
        run: vendor/bin/pint --test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev

      - name: Build assets
        run: npm run build
